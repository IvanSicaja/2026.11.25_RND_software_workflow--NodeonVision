# =============================================================================
# Nodeon - Test Specification - source data
# -----------------------------------------------------------------------------
# Every test case (TC) verifies one or more requirements (reqs) and can be run
#   * MANUALLY  - follow "steps" (action -> expected result), record the result
#                 in the generated manual protocol (05_Manual_Test_Protocol.xlsx)
#   * AUTOMATED - by the tests listed in "automated" (existing unit / GUI
#                 tests) and by every automated test whose NAME CONTAINS the TC
#                 id (BDD scenarios "TC-FOLD-001 ...", pytest "test_TC_FOLD_001_...").
#                 The report generator finds those automatically.
#
# Line numbers in the steps are the numbers in Nodeon's left margin (1 = first).
# Test data: tests/test_automation/specs/test_data/
#   tree_a.txt                   small tree with explanations (8 lines)
#   tree_b_example_project.txt   the project tree (3 levels, 66 lines)
#
# Fields: level  Unit | Integration | System | Acceptance
#         technique  how the test was designed (see the guide, chapter 6)
# =============================================================================

test_cases:

# ------------------------------------------------------------------------- GEN
- id: TC-GEN-001
  title: Start with and without a tree file
  reqs: [REQ-GEN-001, REQ-GEN-006]
  level: System
  technique: Use case
  priority: High
  preconditions: Python and PySide6 installed. A copy of tree_a.txt.
  steps:
    - ["Run: python main/main.py", "Window 'Untitled — Nodeon' opens with the text 'new-project/'."]
    - ["Close it. Run: python main/main.py <path>/tree_a.txt", "Title 'tree_a.txt — Nodeon'; 8 lines are shown."]
  automated: []

- id: TC-GEN-002
  title: Model file is always taken from the folder of main.py; clear errors otherwise
  reqs: [REQ-GEN-002, REQ-GEN-003]
  level: Integration
  technique: Error guessing, equivalence classes (5 broken file kinds)
  priority: High
  preconditions: A copy of the project folder you may break.
  steps:
    - ["Start from the project root: python main/main.py; then from main/: python main.py", "Both start normally."]
    - ["Rename main/treemodel.py and start", "Message 'The file treemodel.py was not found' with the expected path; app stops (no traceback window)."]
    - ["Make treemodel.py empty (0 bytes) and start", "Message 'treemodel.py is empty'."]
    - ["Put the content of main.py into treemodel.py and start", "Message that it is not Nodeon's file / contains main.py."]
    - ["Restore the original file", "App starts normally again."]
  automated:
    - "gui: StartupTests::test_correct_file_loads"
    - "gui: StartupTests::test_missing_file"
    - "gui: StartupTests::test_empty_file"
    - "gui: StartupTests::test_wrong_file"
    - "gui: StartupTests::test_broken_file"
    - "gui: StartupTests::test_app_uses_file_next_to_main"

- id: TC-GEN-003
  title: Settings of the old name 'Tree Editor' are taken over
  reqs: [REQ-GEN-004]
  level: Integration
  technique: Use case
  priority: Low
  preconditions: Settings stored under organisation/application 'TreeEditor', none under 'Nodeon'.
  steps:
    - ["Start Nodeon", "Recent files, zoom and theme from the old settings are used."]
  automated: []

- id: TC-GEN-004
  title: First start uses full height and half the width
  reqs: [REQ-GEN-005]
  level: System
  technique: Use case
  priority: Low
  preconditions: No Nodeon settings yet (first start).
  steps:
    - ["Start Nodeon", "The window is as high as the screen (without task bar), half as wide, centred."]
  automated: []

# ------------------------------------------------------------------------- FMT
- id: TC-FMT-001
  title: The project tree is reproduced exactly (structure, last child, spacers)
  reqs: [REQ-FMT-001, REQ-FMT-002, REQ-FMT-003, REQ-FMT-007]
  level: Integration
  technique: Round trip (open -> save -> compare)
  priority: High
  preconditions: Copy of tree_b_example_project.txt.
  steps:
    - ["Open the file and save it without changes (Ctrl+S)", "The saved file is byte-identical to the original."]
    - ["Check any line with a sub-tree", "Children use '├── ', the last child '└── '; every level is 4 columns wide; empty '│' lines are still there."]
  automated:
    - "unit: ParseRender::test_example_is_stable"
    - "unit: ParseRender::test_canonical_output"

- id: TC-FMT-002
  title: Explanations start with ➡️ (also ➡ without emoji selector)
  reqs: [REQ-FMT-004]
  level: Unit
  technique: Equivalence classes
  priority: High
  preconditions: tree_a.txt open.
  steps:
    - ["Look at line 3", "'Source code' after ➡️ is shown in the explanation colour (violet)."]
    - ["Edit a branch (Ctrl+Shift+E), add an explanation, OK, save", "The file contains '➡️ <your text>'."]
  automated:
    - "unit: ArrowMarker::test_reads_arrow_plain_arrow_and_hash"
    - "unit: ArrowMarker::test_writes_arrow"
    - "unit: ArrowMarker::test_line_segments_with_arrow"
    - "unit: ArrowMarker::test_explanation_alone_and_empty"
    - "gui: GuiTests::test_new_explanation_written_with_arrow"

- id: TC-FMT-003
  title: '"#" is ordinary text'
  reqs: [REQ-FMT-005, REQ-MARK-005]
  level: System
  technique: Negative test
  priority: High
  preconditions: A new tree.
  steps:
    - ["Type 'src/   # note' as a name", "The whole text has the name colour; no violet."]
    - ["Save and reopen", "The line is unchanged; no ➡️ was added."]
  automated:
    - "unit: ArrowMarker::test_hash_is_normal_text"
    - "unit: ArrowMarker::test_name_with_hash_inside_is_kept"
    - "gui: GuiTests::test_hash_is_normal_text_everywhere"
    - "gui: GuiTests::test_typing_hash_vs_arrow"
    - "gui: GuiTests::test_alignment_ignores_hash"

- id: TC-FMT-004
  title: Multi-line explanations and empty lines are kept
  reqs: [REQ-FMT-006, REQ-FMT-007]
  level: Unit
  technique: Round trip
  priority: High
  preconditions: tree_a.txt open.
  steps:
    - ["Line 7 '│   ➡️ second line' belongs to docs/: open the edit dialog on line 6", "The explanation box shows two lines: 'Documentation' and 'second line'."]
    - ["Cancel, save, compare the file", "Unchanged."]
  automated:
    - "unit: ParseRender::test_multiline_comment_and_gaps"
    - "unit: Spacers::test_spacers_round_trip"

- id: TC-FMT-005
  title: ASCII trees, tabs, NBSP and plain indentation are read
  reqs: [REQ-FMT-008]
  level: Unit
  technique: Equivalence classes
  priority: Medium
  preconditions: tree_c_ascii.txt.
  steps:
    - ["Open tree_c_ascii.txt", "It is shown as a tree with fold arrow on 'src'."]
    - ["Press Ctrl+Alt+L", "The lines become '├── src', '│   ├── main.py', '│   └── util.py', '└── docs'."]
  automated:
    - "unit: ParseRender::test_ascii_and_tabs"

- id: TC-FMT-006
  title: Format document aligns explanations and is idempotent
  reqs: [REQ-FMT-009]
  level: Integration
  technique: Invariant (formatting twice = once)
  priority: High
  preconditions: tree_a.txt open; move explanations with Alt+Right twice.
  steps:
    - ["Press Ctrl+Alt+L", "Consecutive siblings share one ➡️ column; column >= 35; >= 3 spaces after the longest name."]
    - ["Press Ctrl+Alt+L again", "Nothing changes."]
  automated:
    - "gui: GuiTests::test_format_document_still_auto_aligns"
    - "unit: ExplanationColumns::test_canonical_format_unchanged"

- id: TC-FMT-007
  title: Text above the tree is kept
  reqs: [REQ-FMT-010]
  level: Unit
  technique: Boundary (before the first branch)
  priority: Low
  preconditions: A file whose first line is '➡️ notes' followed by a tree.
  steps:
    - ["Open, save, compare", "The first line is unchanged."]
  automated: []

