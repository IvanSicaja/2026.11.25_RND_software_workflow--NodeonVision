# pytest configuration for the Nodeon system-test frameworks
# (the developers' unit / integration tests in ../test_*.py are run separately).
[pytest]
pythonpath = python python/web_tests
testpaths = python/system_tests python/bdd_pytest
# python/web_tests (Playwright) runs separately, after the report has been generated
bdd_features_base_dir = features/
markers =
    desktop: shared scenario that the C# Reqnroll + FlaUI framework also runs
    python_only: scenario only the Python frameworks can check (e.g. drawn colours)
    req(ids): requirement ids a plain pytest test verifies
    tc(id): test case id a plain pytest test implements
addopts = -p no:cacheprovider
